[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# PR correctness lives in CI; packaging runs only for release tags.
pr-run-mode = "skip"

# The host triple is explicit because cargo-dist cannot infer custom labels.
[dist.github-custom-runners]
global = { runner = "depot-ubuntu-22.04-4", host = "x86_64-unknown-linux-gnu" }
x86_64-unknown-linux-gnu = { runner = "depot-ubuntu-22.04-4", host = "x86_64-unknown-linux-gnu" }
aarch64-unknown-linux-gnu = { runner = "depot-ubuntu-22.04-arm-4", host = "aarch64-unknown-linux-gnu" }
x86_64-apple-darwin = { runner = "depot-macos-latest", host = "aarch64-apple-darwin" }
aarch64-apple-darwin = { runner = "depot-macos-latest", host = "aarch64-apple-darwin" }
x86_64-pc-windows-msvc = { runner = "depot-windows-2022-4", host = "x86_64-pc-windows-msvc" }

